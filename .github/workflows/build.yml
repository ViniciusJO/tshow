name: Build and release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make -Bk
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: tshow


