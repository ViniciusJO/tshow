name: Build and release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libglfw3 \
          libglfw3-dev \
          libinput-dev \
          xserver-xorg-input-all \
          xserver-xorg-video-all \
          libxfixes-dev
    - uses: actions/checkout@v4
    - name: Make
      run: make -Bk
    - name: Pack
      run: tar czvf tshow.tar.gz tshow
    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: tshow.tar.gz


